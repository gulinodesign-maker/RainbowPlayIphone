  <polygon points="256.0,114.0 299.6,150.7 356.4,155.6 361.3,212.4 398.0,256.0 361.3,299.6 356.4,356.4 299.6,361.3 256.0,398.0 212.4,361.3 155.6,356.4 150.7,299.6 114.0,256.0 150.7,212.4 155.6,155.6 212.4,150.7" fill="url(#gearMetal)"/>
  <circle cx="256" cy="256" r="92" fill="url(#ringBlue)"/>
  <circle cx="256" cy="256" r="55" fill="url(#gearMetal)"/>
  <circle cx="256" cy="256" r="18" fill="#d1d5db"/>
