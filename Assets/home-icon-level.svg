<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">

<defs>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
    <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.20"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
  </filter>
</defs>

<rect x="36" y="36" width="440" height="440" rx="92" fill="url(#bg)" filter="url(#shadow)"/>
<rect x="36" y="36" width="440" height="440" rx="92" fill="url(#shine)"/>

<defs>
  <linearGradient id="bg" x1="36" y1="36" x2="476" y2="476" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#76ff3b"/>
    <stop offset="1" stop-color="#0fb94c"/>
  </linearGradient>
  <radialGradient id="targetWhite" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(204 262) rotate(90) scale(140)">
    <stop stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fafc"/>
  </radialGradient>
  <linearGradient id="targetRed" x1="110" y1="160" x2="300" y2="370" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ff5b5b"/>
    <stop offset="1" stop-color="#d80b27"/>
  </linearGradient>
  <linearGradient id="arrowBlue" x1="225" y1="150" x2="350" y2="250" gradientUnits="userSpaceOnUse">
    <stop stop-color="#2ec5ff"/>
    <stop offset="1" stop-color="#3167ff"/>
  </linearGradient>
</defs>
<g filter="url(#softShadow)">
  <circle cx="210" cy="278" r="116" fill="url(#targetRed)"/>
  <circle cx="210" cy="278" r="86" fill="url(#targetWhite)"/>
  <circle cx="210" cy="278" r="58" fill="url(#targetRed)"/>
  <circle cx="210" cy="278" r="31" fill="url(#targetWhite)"/>
  <circle cx="210" cy="278" r="14" fill="#d80b27"/>
  <rect x="234" y="212" width="125" height="14" rx="7" transform="rotate(-42 234 212)" fill="#94a3b8"/>
  <path d="M330 131 L391 150 L348 196 Z" fill="url(#arrowBlue)"/>
  <path d="M325 137 L362 184 L348 196 L313 148 Z" fill="#6ee7ff"/>
</g>
<g filter="url(#softShadow)">
  <rect x="104" y="198" width="15" height="54" rx="7.5" transform="rotate(-30 104 198)" fill="#ffe43b"/>
  <rect x="94" y="242" width="15" height="45" rx="7.5" transform="rotate(-86 94 242)" fill="#ffd11a"/>
  <rect x="117" y="159" width="15" height="47" rx="7.5" transform="rotate(-44 117 159)" fill="#ffef69"/>
