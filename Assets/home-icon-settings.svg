<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">

<defs>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
    <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.20"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/>
  </filter>
</defs>

<rect x="36" y="36" width="440" height="440" rx="92" fill="url(#bg)" filter="url(#shadow)"/>
<rect x="36" y="36" width="440" height="440" rx="92" fill="url(#shine)"/>

<defs>
  <linearGradient id="bg" x1="36" y1="36" x2="476" y2="476" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ddd6fe"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="gearMetal" x1="155" y1="145" x2="357" y2="355" gradientUnits="userSpaceOnUse">
